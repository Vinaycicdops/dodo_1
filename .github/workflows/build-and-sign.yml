name: Build, Push, and Sign Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # # Install Cosign tool to sign the container image
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # Log in to Docker Hub using secrets stored in GitHub Repo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: crysis307
          password: ${{ secrets.DTKN }}

      # Extract metadata (tags, labels) for Docker image tags (like SHA or git tag)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: crysis307/ledger-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      # Build and push the image using the secure Dockerfile under app/
      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./ledger-api-src/app
          push: true
          tags: crysis307/ledger-api:${{ github.sha }}

      # Sign the image using Cosign with the private key stored in GitHub Secrets
      - name: Sign the published Docker image
        if: ${{ success() }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Get the digest of the pushed image
          image_digest="${{ steps.build-push.outputs.digest }}"
          
          # Sign the commit SHA tag
          echo "Signing tag: crysis307/ledger-api:${{ github.sha }}@${image_digest}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "crysis307/ledger-api:${{ github.sha }}@${image_digest}"
