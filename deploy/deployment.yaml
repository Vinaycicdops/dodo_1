---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: ledger-api
  labels:
    app: ledger-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      serviceAccountName: ledger-api
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
      containers:
        - name: ledger-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: 
                - ALL
          image: crysis307/ledger-api:f2a9f3cd39c26f045216582842bd125ee212bb82
          ports:
          - containerPort: 8080
            name: http
          envFrom:
          - configMapRef:
              name: ledger-api-config

          - secretRef:
              name: ledger-api-secret
          readinessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
          - mountPath: /tmp
            name: tmp

