apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root
  annotations:
    policies.kyverno.io/title: "Disallow Root User"
    policies.kyverno.io/category: "Pod Security Standards (Restricted)"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/description: "Enforces that pods must run as a non-root user."
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - ingress-nginx
                - argo-rollouts
                - istio-system
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Running as root is disallowed. Set spec.securityContext.runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: "Disallow Latest Image Tag"
    policies.kyverno.io/category: "Best Practices"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/description: "Enforces that containers do not use images with the ':latest' tag or no tag."
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-latest-tag
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - ingress-nginx
                - argo-rollouts
                - istio-system
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Using the ':latest' tag or no tag is disallowed. Please use a specific version tag."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: "*:*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: "Verify Image Signatures"
    policies.kyverno.io/category: "Software Supply Chain Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/description: "Verifies that images matching crysis307/ledger-api are signed with a trusted Cosign key."
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "crysis307/ledger-api:*"
          key: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyc1xcQdaPxvv4IDOvzV85onRLF28
            EsG4yBjqQijbNT2BQpuHwnjzKFxRz4xh53GcjfgYFLMQgQxrAsi+Dhwa9A==
            -----END PUBLIC KEY-----
